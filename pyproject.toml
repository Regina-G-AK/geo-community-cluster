[build-system]
requires = ["setuptools==67.7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business-district-clustering"
version = "0.1.0"
description = "基于交易共现的商圈冷启动聚类"
readme = "README.md"
requires-python = ">=3.7.1,<3.8"
dependencies = [
    "igraph==0.10.8",
    "leidenalg==0.9.0",
    "networkx==2.6.3",
    "openpyxl==3.0.10",
    "pandas==1.3.5",
]

[project.optional-dependencies]
test = [
    "pytest==7.4.4",
]

[tool.setuptools.packages.find]
include = ["business_district*", "incremental_assignment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[graph]
edge_weight_method = "sppmi"
