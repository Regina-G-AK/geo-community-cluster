[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-district-clustering"
version = "0.1.0"
description = "基于交易共现的商圈冷启动聚类"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "igraph>=1.0.0,<2.0",
    "leidenalg>=0.12.0,<0.13",
    "networkx>=3.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
business-district = "business_district.cli:main"
business-district-hive = "business_district.hive_task:main"
incremental-assignment = "incremental_assignment.cli:main"
incremental-assignment-hive = "incremental_assignment.hive_task:main"

[tool.setuptools.packages.find]
include = ["business_district*", "incremental_assignment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[graph]
edge_weight_method = "sppmi"
