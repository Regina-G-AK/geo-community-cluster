[city]
code = "shanghai"
name = "上海市"

[input]
transactions_path = "../data.txt"
timestamp_formats = %Y%m%dT%H%M%S, %Y%m%d%H%M%S, %Y-%m-%d %H:%M:%S, %Y/%m/%d %H:%M:%S

[visits]
merge_window_minutes = 30
maximum_daily_merchants_per_card = 30

[cooccurrence]
window_minutes = 120
decay_tau_minutes = 60.0
minimum_unique_users = 3

[graph]
edge_weight_method = "sppmi"
context_smoothing_alpha = 0.75
sppmi_shift = 3.0
top_k_neighbors = 10
minimum_z_score = 0.5
degree_penalty_gamma = 0.5
jaccard_threshold = 0.1

[community]
algorithm = "leiden"
resolution = 1.0
random_seed = 42
maximum_cleaning_rounds = 3
minimum_hub_degree = 8
participation_threshold = 0.75

[anchors]
minimum_count = 3
maximum_count = 10
merchants_per_anchor = 20
minimum_community_size = 3
maximum_participation = 0.1
chain_visit_count_quantile = 0.9
chain_minimum_visit_count = 100

[output]
directory = "../algorithm_one_output"

[experiments]
path = "../docs/experiments.md"
